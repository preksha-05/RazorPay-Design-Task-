<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cleartrip · AI holiday planner for business travellers (concept)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --or:#FF4F17; --or-dk:#E2400D; --or-lt:#FFF3EE; --ink:#1A1A1A; --grey:#808080; --grey2:#4D4D4D;
  --line:#E7E7E7; --bg:#F6F6F6; --white:#fff; --blue:#3366CC; --blue-lt:#EEF3FC;
  --green:#11A670; --green-lt:#E8F7F1; --yel:#B26B00; --yel-lt:#FFF6E0; --red:#D63B30; --red-lt:#FDEDEC;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Inter,system-ui,-apple-system,sans-serif;color:var(--ink);background:#ECEBE8;font-size:14px;line-height:1.4;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
.stage{min-height:100%;display:flex;gap:40px;align-items:center;justify-content:center;padding:28px}
.phone{width:390px;height:844px;background:var(--white);border-radius:46px;box-shadow:0 0 0 10px #111,0 0 0 11px #333,0 30px 80px rgba(0,0,0,.3);position:relative;overflow:hidden;flex:none}
.island{position:absolute;left:50%;top:10px;transform:translateX(-50%);width:118px;height:32px;background:#000;border-radius:20px;z-index:80}
.status{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;font-weight:600;font-size:14px;background:var(--white);position:relative;z-index:5}
.screen{position:absolute;top:44px;left:0;right:0;bottom:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;background:var(--white)}
.screen::-webkit-scrollbar{display:none}
.screen.grey{background:var(--bg)}
@media (max-width:860px){.stage{padding:0;display:block}.notes{display:none}.phone{width:100%;height:100dvh;border-radius:0;box-shadow:none}.island{display:none}}

/* notes */
.notes{width:330px;max-height:844px;overflow:auto;font-size:13px;color:#333}
.notes .k{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#888}
.notes h1{font-size:30px;font-weight:800;letter-spacing:-.8px;margin-top:6px}
.notes h1 span{color:var(--or)}
.notes .box{background:#fff;border-radius:12px;padding:14px;margin-top:12px;border:1px solid var(--line)}
.notes h3{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#888;margin-bottom:6px}
.notes .nb{font-size:13.5px;line-height:1.5}
.jump{display:flex;flex-wrap:wrap;gap:6px}
.jump button{font-size:12px;padding:5px 10px;border-radius:20px;border:1px solid var(--line);background:#fff}
.jump button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.tg{display:flex;justify-content:space-between;align-items:center;width:100%;padding:8px 0;font-size:12.5px;border-bottom:1px solid #f0f0f0}
.tg:last-child{border:0}
.sw{width:32px;height:18px;border-radius:9px;background:#ccc;position:relative;transition:.2s;flex:none}
.sw::after{content:"";position:absolute;left:2px;top:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:.2s}
.on>.sw,.sw.on{background:var(--green)}.on>.sw::after,.sw.on::after{left:16px}

/* basics */
.ico{width:20px;height:20px;flex:none}
.hdr{position:sticky;top:0;z-index:10;background:var(--white);display:flex;align-items:center;gap:12px;padding:10px 16px 12px;border-bottom:1px solid var(--line)}
.hdr .t{font-size:16px;font-weight:700}
.hdr .s{font-size:12px;color:var(--grey)}
.pad{padding:16px}
.sec{background:var(--white);padding:16px;margin-bottom:8px}
.h{font-size:20px;font-weight:700;letter-spacing:-.3px;line-height:1.25}
.lbl{font-size:15px;font-weight:700;margin-bottom:10px}
.muted{color:var(--grey);font-size:12.5px}
.row{display:flex;align-items:center;gap:10px}
.sp{justify-content:space-between}
.btn{height:48px;border-radius:8px;background:var(--or);color:#fff;font-weight:700;font-size:15px;width:100%;display:flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn:active{background:var(--or-dk)}
.btn.out{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.sm{height:40px;font-size:14px}
.link{color:var(--blue);font-weight:600;font-size:13px}
.chip{padding:8px 14px;border-radius:20px;border:1px solid var(--line);font-size:13.5px;font-weight:500;background:#fff;white-space:nowrap}
.chip.on{border-color:var(--or);background:var(--or-lt);color:var(--or-dk);font-weight:600}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.tag{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:600;padding:2px 7px;border-radius:4px;white-space:nowrap}
.tag.me{background:var(--or-lt);color:var(--or-dk)}
.tag.co{background:var(--blue-lt);color:var(--blue)}
.tag.flex{background:#F1EDFF;color:#5B3FD0}
.tag.ok{background:var(--green-lt);color:var(--green)}
.ai{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;color:var(--or-dk);background:var(--or-lt);padding:3px 8px;border-radius:20px}
.card{border:1px solid var(--line);border-radius:12px;background:#fff}
.fade{animation:fade .3s ease both}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
.bar{position:absolute;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 16px 24px;z-index:20;box-shadow:0 -4px 16px rgba(0,0,0,.04)}
.price{font-size:20px;font-weight:800;letter-spacing:-.3px}

/* trips */
.logo{font-weight:800;font-size:22px;letter-spacing:-.8px;display:flex;align-items:center;gap:4px}
.logo i{width:18px;height:18px;border-radius:5px;background:var(--or);display:inline-block}
.tabs{display:flex;gap:22px;border-bottom:1px solid var(--line);padding:0 16px}
.tabs div{padding:12px 0;font-weight:600;color:var(--grey);font-size:14px}
.tabs div.on{color:var(--ink);box-shadow:inset 0 -2px 0 var(--or)}
.seg{display:flex;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.seg b{font-weight:600}
.week{display:flex;gap:4px;margin:12px 0 6px}
.week div{flex:1;text-align:center;font-size:11px;font-weight:600;padding:7px 0;border-radius:6px}
.week .w{background:var(--blue-lt);color:var(--blue)}
.week .f{background:var(--or);color:#fff}
.nav{position:absolute;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:1px solid var(--line);padding:8px 0 24px;z-index:20}
.nav div{flex:1;text-align:center;font-size:11px;color:var(--grey);display:flex;flex-direction:column;align-items:center;gap:3px}
.nav div.on{color:var(--or);font-weight:600}

/* form */
.fact{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.fact:last-child{border:0}
.fact .c{width:22px;height:22px;border-radius:50%;background:var(--green-lt);color:var(--green);display:grid;place-items:center;flex:none}
.fact.off .c{background:#eee;color:#aaa}
.fact.off .ft{text-decoration:line-through;color:var(--grey)}
.fact .ft{flex:1;font-weight:500}
.rec{width:100%;display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px}
.rec.on{border-color:var(--or);background:var(--or-lt)}
.radio{width:20px;height:20px;border-radius:50%;border:2px solid #ccc;flex:none;display:grid;place-items:center}
.rec.on .radio{border-color:var(--or)}
.rec.on .radio::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--or)}
input[type=range]{width:100%;accent-color:var(--or);margin-top:8px}

/* planning */
.st{display:flex;gap:12px;align-items:center;padding:12px 0;opacity:.35;transition:.3s;font-weight:500}
.st.on,.st.done{opacity:1}
.st .d{width:22px;height:22px;border-radius:50%;border:2px solid #ddd;flex:none;display:grid;place-items:center}
.st.on .d{border-color:var(--or);border-top-color:transparent;animation:spin .8s linear infinite}
.st.done .d{background:var(--green);border-color:var(--green)}
.sk{height:72px;border-radius:12px;background:linear-gradient(90deg,#f0f0f0,#fafafa,#f0f0f0);background-size:200% 100%;animation:sh 1.2s infinite;margin-top:10px}
@keyframes sh{to{background-position:-200% 0}}

/* plan */
.opts{display:flex;gap:10px;overflow-x:auto;padding:2px 16px 4px;margin:0 -16px;scrollbar-width:none}
.opts::-webkit-scrollbar{display:none}
.opt{flex:none;width:150px;border:1px solid var(--line);border-radius:12px;padding:12px}
.opt.on{border:2px solid var(--or);padding:11px}
.opt .n{font-weight:700;font-size:15px}
.opt .p{font-weight:700;margin-top:6px}
.best{font-size:10.5px;font-weight:700;color:var(--green);text-transform:uppercase;letter-spacing:.03em}
.why1{display:flex;gap:8px;margin-top:12px;font-size:13px;color:var(--grey2)}
.info{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;background:#F4F1FF;color:#3F2BA0;font-size:13px;margin-top:12px}
.warn{padding:12px;border-radius:10px;background:var(--yel-lt);color:#6B4300;font-size:13px;margin-top:12px}
.dayh{display:flex;justify-content:space-between;align-items:baseline;padding:16px 16px 8px}
.dayh b{font-size:15px}
.it{display:flex;gap:12px;padding:12px 16px;border-bottom:1px solid #f2f2f2;background:#fff;transition:background .6s}
.it.hl{background:#FFF8E6}
.it .icb{width:40px;height:40px;border-radius:10px;background:var(--bg);display:grid;place-items:center;flex:none;color:var(--grey2)}
.it.flexi .icb{background:#F1EDFF;color:#5B3FD0}
.it .m{flex:1;min-width:0}
.it .tt{font-weight:600}
.it .mm{font-size:12.5px;color:var(--grey);margin-top:1px}
.it .ac{display:flex;gap:14px;margin-top:6px}
.it .ac button{color:var(--blue);font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:3px}
.it .ac button.lk{color:var(--ink)}
.it .pr{text-align:right;font-weight:700;white-space:nowrap}
.it .pr .tag{margin-top:4px}
.work{display:flex;gap:12px;align-items:center;margin:0 16px;padding:12px;border-radius:12px;background:var(--blue-lt)}
.qa{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:0 16px}
.qa::-webkit-scrollbar{display:none}
.qa .chip{padding:6px 12px;font-size:12.5px}

/* sheets */
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.4);z-index:40;opacity:0;pointer-events:none;transition:.25s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:20px 20px 0 0;z-index:41;transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);max-height:85%;overflow:auto;padding:8px 16px 28px}
.sheet.on{transform:none}
.grab{width:36px;height:4px;border-radius:2px;background:#ddd;margin:0 auto 14px}
.tick{display:flex;gap:10px;padding:7px 0;font-size:14px}
.tick svg{color:var(--green)}
.alt{width:100%;display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:10px;margin-top:8px}
.alt.on{border-color:var(--or);background:var(--or-lt)}
.up{color:var(--yel);font-weight:700;font-size:12.5px}.dn{color:var(--green);font-weight:700;font-size:12.5px}
.box2{display:flex;gap:8px;margin-top:12px}
.box2>div{flex:1;border-radius:10px;padding:12px}

/* toast */
.toast{position:absolute;left:12px;right:12px;top:52px;z-index:70;background:#1A1A1A;color:#fff;border-radius:10px;padding:12px 14px;font-size:13px;display:flex;gap:10px;align-items:center;transform:translateY(-200%);opacity:0;visibility:hidden;transition:transform .3s,opacity .2s,visibility .3s}
.toast.on{transform:none;opacity:1;visibility:visible}
.toast.w{background:#fff;color:var(--ink);box-shadow:0 8px 30px rgba(0,0,0,.18)}

/* booking */
.hold{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.hold .s{width:22px;height:22px;border-radius:50%;border:2px solid #ddd;flex:none;display:grid;place-items:center}
.hold.ing .s{border-color:var(--or);border-top-color:transparent;animation:spin .8s linear infinite}
.hold.ok .s{background:var(--green);border-color:var(--green)}
.hold.pa .s{border-color:var(--yel);background:var(--yel-lt)}
.hold.fl .s{background:var(--red);border-color:var(--red)}
.hold .n{flex:1;font-weight:500}
.hold .n small{display:block;color:var(--grey);font-weight:400;font-size:12px}
.chg{display:grid;grid-template-columns:1fr 16px 1fr;gap:8px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);font-size:13px}
.chg .a{color:var(--grey);text-decoration:line-through}
.chg .b{font-weight:600}
.chg .l{grid-column:1/-1;font-size:11px;font-weight:700;color:var(--grey);text-transform:uppercase;letter-spacing:.04em}

/* check-in */
.notif{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;gap:10px;align-items:center;box-shadow:0 4px 14px rgba(0,0,0,.06)}
.appic{width:36px;height:36px;border-radius:9px;background:var(--or);display:grid;place-items:center;flex:none;color:#fff}
.mood{width:100%;display:flex;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px}
.mood.on{border-color:var(--or);background:var(--or-lt)}
.mood .mi{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;flex:none}
.mood .mt{font-weight:700}
.mood .md{font-size:12.5px;color:var(--grey)}
.sugg{font-size:10.5px;font-weight:700;color:var(--green);text-transform:uppercase}
.inv{border-radius:12px;overflow:hidden;border:1px solid var(--line);margin-top:14px}
.inv .ih{background:var(--or);color:#fff;padding:14px}
.inv .ib{padding:12px 14px;font-size:13px}
.empty{text-align:center;padding:50px 24px}
.circle{width:96px;height:96px;border-radius:50%;background:var(--or-lt);display:grid;place-items:center;margin:0 auto 16px;color:var(--or)}
.err{background:var(--red-lt);color:#7a1d16;border-radius:10px;padding:14px;margin-top:14px;font-size:13px}

/* stretch the trip */
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;position:relative;touch-action:none;user-select:none;margin-top:12px;padding-bottom:22px}
.dc{height:84px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:8px 0 7px;font-size:11px;font-weight:600;transition:background .2s,color .2s}
.dc .dnum{font-size:16px;font-weight:700}
.dc.w{background:var(--blue-lt);color:var(--blue)}
.dc.h{background:var(--or);color:#fff}
.dc.n{background:#fff;border:1.5px dashed #D5D5D5;color:#B5B5B5}
.handle{position:absolute;top:90px;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;background:#fff;border:3px solid var(--or);box-shadow:0 3px 10px rgba(0,0,0,.25);display:grid;place-items:center;color:var(--or);cursor:grab;transition:left .18s;z-index:3}
.handle.drag{cursor:grabbing;transform:scale(1.15)}
.hint{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--grey);margin-top:10px}
.hint .pulse{width:8px;height:8px;border-radius:50%;background:var(--or);animation:pl 1.4s infinite}
@keyframes pl{0%{box-shadow:0 0 0 0 rgba(255,79,23,.5)}100%{box-shadow:0 0 0 10px rgba(255,79,23,0)}}
.slot{display:flex;gap:12px;align-items:center;padding:12px;border:1.5px solid var(--line);border-radius:12px;margin-top:8px;background:#fff;transition:.15s}
.slot.drop{border-color:var(--or);border-style:dashed;background:var(--or-lt)}
.slot.over{border-color:var(--or);border-style:solid;background:var(--or-lt);transform:scale(1.02)}
.slot.fixed{background:var(--bg);border-color:transparent}
.slot.pop{animation:pop .45s ease}
@keyframes pop{0%{transform:scale(.96)}60%{transform:scale(1.03)}100%{transform:none}}
.slot .dl{width:44px;flex:none;text-align:center;font-size:11px;font-weight:700;color:var(--grey);line-height:1.2}
.slot .dl b{display:block;font-size:15px;color:var(--ink)}
.stk{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:3px 8px;border-radius:20px}
.tray{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px 10px}
.tray::-webkit-scrollbar{display:none}
.sticker{flex:none;display:flex;align-items:center;gap:5px;padding:8px 10px;border-radius:24px;font-weight:700;font-size:12.5px;touch-action:none;cursor:grab;user-select:none;box-shadow:0 2px 6px rgba(0,0,0,.08)}
.sticker.held{outline:2px solid var(--ink);outline-offset:2px}
.ghost{position:absolute;z-index:90;pointer-events:none;transform:translate(-50%,-60%) rotate(-4deg) scale(1.08);box-shadow:0 10px 24px rgba(0,0,0,.25)}

/* swipe the vibe */
.deck{position:relative;height:340px;margin-top:14px}
.vc{position:absolute;inset:0;border-radius:18px;padding:20px;display:flex;flex-direction:column;justify-content:space-between;color:#fff;touch-action:none;user-select:none;box-shadow:0 10px 30px rgba(0,0,0,.15);transition:transform .3s,opacity .3s}
.vc.back{transform:scale(.94) translateY(14px);opacity:.7}
.vc .when{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:.9}
.vc .big{width:76px;height:76px;border-radius:22px;background:rgba(255,255,255,.22);display:grid;place-items:center}
.vc .vt{font-size:24px;font-weight:800;line-height:1.15;letter-spacing:-.4px}
.vc .vp{font-size:14px;font-weight:600;opacity:.95;margin-top:6px}
.stamp{position:absolute;top:22px;padding:4px 12px;border:3px solid #fff;border-radius:8px;font-weight:900;font-size:22px;letter-spacing:.05em;opacity:0}
.stamp.y{right:20px;transform:rotate(12deg)}.stamp.n{left:20px;transform:rotate(-12deg)}
.sbtn{display:flex;justify-content:center;gap:28px;margin-top:18px}
.sbtn button{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;box-shadow:0 4px 14px rgba(0,0,0,.12);background:#fff}
.dots{display:flex;gap:5px;justify-content:center;margin-top:12px}
.dots i{width:7px;height:7px;border-radius:50%;background:#ddd}.dots i.on{background:var(--or)}
.res{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}

/* presentation frame */
.credit{position:fixed;top:16px;left:20px;z-index:200;font-size:12px;line-height:1.45;color:#666;border-left:3px solid var(--or);padding-left:10px}
.credit b{display:block;font-size:14px;color:#1A1A1A}
@media (max-width:1300px){.credit{position:static;align-self:flex-start}}
@media (max-width:860px){.credit{display:none}}
.wrap{min-height:100%;display:flex;flex-direction:column;align-items:center;padding:18px 20px 10px;gap:16px}
.toolbar{display:flex;flex-direction:column;gap:8px;align-items:center;max-width:1100px}
.tb{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
.tbl{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#888;width:84px;text-align:right}
#edges button{border-color:#F3C9B9;color:#B23A10}
#edges button.on{background:var(--or);border-color:var(--or);color:#fff}
.stage{position:relative;display:flex;gap:64px;align-items:flex-start;justify-content:center;padding:0}
.col{width:250px;height:844px;position:relative;flex:none}
#lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible;z-index:100}
.ann{position:absolute;left:0;right:0;border:1.5px dashed #FF8A5E;border-radius:10px;padding:8px 10px;background:rgba(255,255,255,.85);font-size:12px;line-height:1.35;color:#444;transition:top .25s,opacity .25s}
.ann b{display:flex;gap:6px;align-items:center;font-size:12.5px;color:#1A1A1A;margin-bottom:2px}
.ann b i{font-style:normal;width:18px;height:18px;border-radius:50%;background:var(--or);color:#fff;font-size:10.5px;display:grid;place-items:center;flex:none}
.ann.dim{opacity:.35}
.foot{font-size:11px;color:#999}
@media (max-width:1100px){.col,#lines{display:none}.stage{gap:0}}
@media (max-width:860px){.wrap{padding:0}.toolbar,.foot{display:none}}

.stp{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;background:#fff}
.opt.off{opacity:.45}

const SCREENS=[['trips','AI finds free days'],['context','Stretch your trip'],['plan','Review your plan'],['review','Confirm & book'],['done','Booked'],['checkin','Wednesday check-in']];
const EDGES=[['empty','No trips yet'],['offline','AI can’t reach flights'],['budget','Over budget'],['overrun','Meeting moved mid-booking'],['soldout','Hotel sold out mid-booking']];
let timers=[];const clearT=()=>{timers.forEach(clearTimeout);timers=[];};
function go(s){S.screen=s;render();scr.scrollTop=0;}
function render(){
  closeSheet();scr.className='screen'+(['plan','done','review'].includes(S.screen)?' grey':'');
  ({trips,context,planning,plan,review,book,slip,done,checkin})[S.screen]();
  $('#jump').innerHTML=SCREENS.map(([x,l],i)=>`<button class="${x===S.screen&&!S.edge?'on':''}" onclick="jumpTo('${x}')">${i+1}. ${l}</button>`).join('');
  $('#edges').innerHTML=EDGES.map(([k,l])=>`<button class="${S.edge===k?'on':''}" onclick="edge('${k}')">${l}</button>`).join('');
  buildAnn();
}
function jumpTo(x){clearT();S=Object.assign(S0(),{});if(x==='checkin'){S.booked=true;}go(x);}
function edge(k){
  clearT();const was=S.edge;S=S0();
  if(was===k){go('trips');return;}
  S.edge=k;
  if(k==='empty'){S.sim.empty=true;go('trips');}
  if(k==='offline'){S.sim.offline=true;go('planning');}
  if(k==='budget'){S.budget=25000;go('plan');}
  if(k==='overrun'){S.sim.overrun=true;go('book');}
  if(k==='soldout'){S.sim.soldout=true;go('book');}
}
const hdr=(t,s,back)=>`<div class="hdr"><button onclick="clearT();go('${back}')">${ic('left',22)}</button><div style="flex:1"><div class="t">${t}</div>${s?`<div class="s">${s}</div>`:''}</div></div>`;
const bar=h=>{$('#barSlot').innerHTML=h?`<div class="bar">${h}</div>`:'';};
const dates=()=>`26 – ${23+S.end} Nov`;

/* ================= 2 stretch ================= */
const STK={explore:'Explore',team:'Socialise',unwind:'Recharge'};
function slotsFor(){
  const out=[{dow:2,id:'w3',lab:'Evening after work'}];
  for(let d=3;d<=S.end;d++){
    if(d===S.end) out.push({dow:d,fixed:'Fly home',sub:'Evening flight · back for Monday'});
    else if(d===3) out.push({dow:d,fixed:'Get to your getaway',sub:'AI picks the place next'});
    else out.push({dow:d,id:d===4?'f1':'s1',lab:'Full day'});
  }
  return out;
}
function context(){
  S.held=null;
  scr.innerHTML=hdr('Plan your holiday','Bengaluru · after your work trip','trips')+`<div class="fade" style="padding-bottom:170px">
  <div class="sec"><div class="lbl" style="margin-bottom:2px">How do you want to feel when work ends?</div><div class="muted" style="margin-bottom:10px">This shapes the place, the stay and each day.</div><div class="feel3" id="feel"></div></div>
  <div class="sec"><div class="row sp"><div class="lbl" style="margin:0">Stretch your trip</div><span class="ai">${ic('spark',12)} AI fills the days</span></div>
   <div class="wk" id="wk"></div><div class="hint" id="hint"></div></div>
  <div class="sec row sp" style="padding-top:12px;padding-bottom:12px"><div><div class="muted">Your budget</div><div class="row" style="gap:8px;margin-top:4px" id="bud"></div></div>
   <div><div class="muted" style="text-align:right">Who’s coming</div><div class="chips" style="margin-top:4px" id="who"></div></div></div>
  <div class="sec"><div class="lbl">Your days</div><div id="slots"></div></div></div>`;
  drawFeel();drawWeek();drawSlots();drawBud();bindWeek();
  bar(`<div class="muted" style="margin-bottom:8px">Fine-tune: drag a mood onto any day. We’ll ask again on Wed.</div>
   <div class="tray">${Object.entries(STK).map(([k,l])=>`<div class="sticker" data-k="${k}" style="background:${MOODS[k].bg};color:${MOODS[k].c}">${ic(MOODS[k].icon,16)} ${l}</div>`).join('')}</div>
   <button class="btn" id="seeplan" onclick="go('planning')"></button>`);
  setBtn();bindStickers();
}
function setBtn(){const b=$('#seeplan');if(b)b.textContent=`See my plan · ${S.end-2} days`;}
function drawBud(){
  $('#bud').innerHTML=`<button class="stp" onclick="bud(-5000)">${ic('minus',16)}</button><b style="min-width:76px;text-align:center">${inr(S.budget)}</b><button class="stp" onclick="bud(5000)">${ic('plus',16)}</button>`;
  $('#who').innerHTML=`<button class="chip ${S.who==='me'?'on':''}" style="padding:6px 10px" onclick="S.who='me';drawBud()">Just me</button><button class="chip ${S.who==='partner'?'on':''}" style="padding:6px 10px" onclick="S.who='partner';drawBud();toast('Partner flies in Wed evening')">+ Partner</button>`;
}
function bud(d){S.budget=Math.min(80000,Math.max(15000,S.budget+d));drawBud();}
function drawWeek(){
  const e=S.end;
  $('#wk').innerHTML=DOW.map((d,i)=>`<div class="dc ${i<3?'w':i<=e?'h':'n'}" data-i="${i}"><span>${d}</span><span class="dnum">${23+i}</span><span>${i<3?ic('brief',14):i<=e?ic('leaf',14):'+'}</span></div>`).join('')+`<div class="handle" id="hd" style="left:${(e+0.5)/7*100}%">${ic('swap',14)}</div>`;
  $('#hint').innerHTML=S._moved?`${ic('check',14,'color:var(--green)')} Holiday: Thu – ${DOW[e]} · ${e-2} days${e<5?' · city break (no long drives)':''}`:`<span class="pulse"></span>Drag the circle to choose your last day`;
}
function drawSlots(drop){
  $('#slots').innerHTML=slotsFor().map(x=>{
    const dl=`<div class="dl">${DOW[x.dow]}<b>${23+x.dow}</b></div>`;
    if(x.fixed) return `<div class="slot fixed">${dl}<div style="flex:1"><div style="font-weight:600">${x.fixed}</div><div class="muted">${x.sub}</div></div>${ic('lock',16,'color:#aaa')}</div>`;
    const k=S.dm[x.id],m=MOODS[k||'unwind'];
    return `<div class="slot ${S.held?'drop':''} ${drop===x.id?'pop':''}" data-slot="${x.id}" onclick="tapSlot('${x.id}')">${dl}<div style="flex:1;min-width:0"><div class="muted" style="font-size:11.5px">${x.lab}</div><div style="font-weight:600">${m.gen[x.id]}</div>
     <div style="margin-top:4px">${k?`<span class="stk" style="background:${m.bg};color:${m.c}">${ic(m.icon,11)} ${STK[k]}</span>`:`<span class="tag flex">${ic('moon',11)} AI pick · can change Wed</span>`}</div></div></div>`;
  }).join('');
}
function setEnd(i){
  i=Math.max(3,Math.min(6,i));if(i===S.end&&S._moved)return;
  const was=S.end;S.end=i;S._moved=true;
  if(!fits(S.plan)){S.plan='blr';if(was>=5)toast('Short trip: AI switched to a Bengaluru city break');}
  else if(was<5&&i>=5&&S.plan==='blr'){S.plan=bestPlace();toast('Long enough to travel again: '+PLANS[S.plan].name);}
  drawWeek();drawSlots();setBtn();
}
function bindWeek(){
  const wk=$('#wk');let drag=false;
  const idx=e=>{const r=wk.getBoundingClientRect();return Math.floor((e.clientX-r.left)/(r.width/7));};
  wk.addEventListener('pointerdown',e=>{const i=idx(e);if(i<3){toast('Mon to Wed are work days');return;}drag=true;wk.setPointerCapture(e.pointerId);setEnd(i);});
  wk.addEventListener('pointermove',e=>{if(drag)setEnd(idx(e));});
  wk.addEventListener('pointerup',()=>{drag=false;});
}
function bindStickers(){
  document.querySelectorAll('.sticker').forEach(el=>{
    el.addEventListener('pointerdown',e=>{
      e.preventDefault();const k=el.dataset.k,phE=document.querySelector('.phone'),ph=phE.getBoundingClientRect();
      let moved=false,g=null,over=null;
      const mv=ev=>{
        if(!moved&&Math.hypot(ev.clientX-e.clientX,ev.clientY-e.clientY)>6){moved=true;g=el.cloneNode(true);g.classList.add('ghost');phE.appendChild(g);S.held=k;drawSlots();}
        if(!moved)return;g.style.left=(ev.clientX-ph.left)+'px';g.style.top=(ev.clientY-ph.top)+'px';
        g.style.display='none';const t=document.elementFromPoint(ev.clientX,ev.clientY);g.style.display='';
        const sl=t&&t.closest('[data-slot]');document.querySelectorAll('.slot.over').forEach(x=>x.classList.remove('over'));if(sl){sl.classList.add('over');over=sl.dataset.slot;}else over=null;
      };
      const up=()=>{document.removeEventListener('pointermove',mv);document.removeEventListener('pointerup',up);if(g)g.remove();
        if(!moved){S.held=S.held===k?null:k;document.querySelectorAll('.sticker').forEach(x=>x.classList.toggle('held',x.dataset.k===S.held));drawSlots();if(S.held)toast('Now tap a day to drop “'+STK[k]+'”');return;}
        S.held=null;if(over)dropOn(over,k);else drawSlots();};
      document.addEventListener('pointermove',mv);document.addEventListener('pointerup',up);
    });
  });
}
function tapSlot(id){if(!S.held)return;const k=S.held;S.held=null;document.querySelectorAll('.sticker').forEach(x=>x.classList.remove('held'));dropOn(id,k);}
function dropOn(id,k){S.dm[id]=k;drawSlots(id);toast(`${{w3:'Wednesday',f1:'Friday',s1:'Saturday'}[id]}: ${MOODS[k].gen[id]}`);}

/* ================= 3 planning ================= */
function planning(){
  clearT();bar('');
  const st=['Reading your work trip','Checking how to move your flight home','Finding places that fit '+(S.end-2)+' days','Matching your budget of '+inr(S.budget),'Making 3 plans'];
  scr.innerHTML=hdr('Planning…','Usually takes 5 seconds','context')+`<div class="pad fade"><span class="ai">${ic('spark',12)} AI is working</span><div style="margin-top:8px" id="sts">${st.map((s,i)=>`<div class="st" id="s${i}"><div class="d"></div>${s}</div>`).join('')}</div><div id="er"></div><div id="sks"><div class="sk"></div><div class="sk" style="opacity:.6"></div></div><button class="btn out" style="margin-top:16px" onclick="clearT();go('context')">Cancel</button></div>`;
  st.forEach((_,i)=>timers.push(setTimeout(()=>{
    if(i>0){const p=$('#s'+(i-1));if(p){p.className='st done';p.querySelector('.d').innerHTML=ic('check',12,'color:#fff');}}
    if(S.sim.offline&&i===2){$('#s1').className='st';$('#sks').style.display='none';clearT();
      const R=[['coorg','Coorg','Coffee hills','5 hr drive'],['mysuru','Mysuru','Palaces & food','3 hr drive'],['blr','Nandi Hills + Bengaluru','City break','1.5 hr drive']];
      $('#er').innerHTML=`<div class="err fade"><b>Can’t check flights right now</b><div style="margin-top:4px">I can still plan everything you can reach by road. I’ll keep checking your flight home and confirm it before you pay.</div></div>
      <div class="lbl" style="margin-top:14px">Road trips from Bengaluru</div><div id="road">${R.map(([k,n,sb,t])=>`<button class="road" onclick="S.sim.offline=false;S.edge=null;S.flightPending=true;S.plan='${k}';go('plan')"><span class="icb">${ic('car')}</span><span style="flex:1;text-align:left"><b>${n}</b><span class="muted" style="display:block">${sb} · ${t}</span></span><b>${inr(meTotal(k))}</b></button>`).join('')}</div>
      <button class="link" style="margin-top:10px" onclick="S.sim.offline=false;S.edge=null;render()">Try flights again</button>`;return;}
    const e=$('#s'+i);if(e)e.className='st on';
  },400+i*550)));
  timers.push(setTimeout(()=>{if(S.screen==='planning'&&!S.sim.offline)go('plan');},400+st.length*550+250));
}

/* ================= 4 plan ================= */
function plan(){
  const p=PLANS[S.plan],me=meTotal(),over=me>S.budget&&!S.booked;
  let h=hdr(S.booked?'Your trip · booked':'Your holiday',`${dates()} · ${p.name}`,S.booked?'done':'context')+`<div class="fade" style="padding-bottom:${S.booked?140:230}px">
  <div class="sec">${S.booked?'':`<div class="lbl">Pick a place</div><div class="opts">${Object.entries(PLANS).map(([k,o])=>{const ok=fits(k);return `<button class="opt ${S.plan===k?'on':''} ${ok?'':'off'}" onclick="${ok?`S.plan='${k}';plan()`:`toast('${o.name} needs at least till Saturday')`}">${k===bestPlace()&&ok?'<div class="best">Best match</div>':`<div class="best" style="color:#bbb">${ok?'Option':'Needs till Sat'}</div>`}<div class="n">${o.name}</div><div class="muted">${o.sub} · ${o.travel}</div><div class="p">${ok?inr(meTotal(k)):'—'}</div></button>`}).join('')}</div>`}
   <div class="why1"><span class="ai" style="flex:none">${ic('spark',11)} Why</span><span>${whyText()}</span></div>
   ${S.notes.length?`<div class="row" style="gap:6px;flex-wrap:wrap;margin-top:10px"><span class="muted">Noted for hosts:</span>${S.notes.map((n,i)=>`<span class="note">${n} <button onclick="S.notes.splice(${i},1);plan()">${ic('x',10)}</button></span>`).join('')}</div>`:''}
   ${S.plan==='coorg'?`<div class="info">${ic('moon',18)}<span style="flex:1;text-align:left"><b>${S.checked?'Adapted on Wednesday':'3 items stay flexible'}</b><br>${S.checked?(S.en?EN[S.en].label+': your trip changed to fit':'Updated at your Wednesday check-in'):'We’ll check your energy on Wed, 5 PM'}</span></div>`:''}
   ${S.flightPending?`<div class="pend">${ic('plane',18)}<span><b>Flight home not confirmed yet</b><br>I’ll keep checking and confirm it before you pay.</span></div>`:''}
   ${over?`<div class="warn fade"><div class="row sp"><b>${inr(me-S.budget)} over your ${inr(S.budget)} budget</b><button class="btn sm" id="savebtn" style="width:auto;padding:0 14px;height:36px" onclick="saveSheet()">See ways to save</button></div><div class="chips" style="margin-top:8px">${S.end>5?`<button class="chip" onclick="fix('short')">End on Saturday</button>`:''}${S.plan==='coorg'&&S.alt.t2==null?`<button class="chip" onclick="fix('stay')">Homestay</button>`:''}${S.plan!=='blr'?`<button class="chip" onclick="fix('blr')">Stay in Bengaluru</button>`:''}<button class="chip" onclick="fix('raise')">Raise budget</button></div>${meTotal('blr')>S.budget?`<div style="margin-top:8px">Nothing fits ${inr(S.budget)} for these dates. Lowest is ${inr(meTotal('blr'))}.</div>`:''}</div>`:''}
  </div>
  <div class="work"><span style="color:var(--blue)">${ic('brief')}</span><div style="flex:1"><b>Mon – Wed · Work trip</b><div class="muted">Not changed</div></div><div style="text-align:right"><b>${inr(coTotal())}</b><div><span class="tag co">Company</span></div></div></div>`;
  days().forEach(d=>{h+=`<div class="dayh"><b>${d.d}</b><span class="muted">${d.n||''}</span></div><div>${d.items.map(itemRow).join('')}${d.dow===2&&S.who==='partner'?itemRow(items().find(i=>i.id==='pp')):''}</div>`;});
  if(S.added.length)h+=`<div class="dayh"><b>Added by you</b></div>${S.added.map(itemRow).join('')}`;
  scr.innerHTML=h+`</div>`;
  if(S.booked){bar(`<div class="row sp"><div><div class="muted">Booked · changes are free till 6 PM</div><div class="price">${inr(me)}</div></div><button class="btn" style="width:150px" onclick="go('done')">Done</button></div>`);return;}
  bar(`<div class="ask"><span style="color:var(--or)">${ic('spark',16)}</span><input id="askIn" placeholder="Ask AI… e.g. “near a beach”, “vegetarian”" onkeydown="if(event.key==='Enter')askFree()"><button onclick="askFree()">${ic('send',15)}</button></div>
   <div class="qa" style="margin:8px -16px 10px">${['Cheaper stay','Add a spa','Less driving'].map(c=>`<button class="chip" onclick="ask('${c}')">${c}</button>`).join('')}</div>
   <div class="row sp"><button onclick="ledger()" style="text-align:left"><div class="muted">You pay <span class="link" style="font-size:12px">· details</span></div><div class="price" style="color:${over?'var(--yel)':'var(--ink)'}">${inr(me)}</div><div class="muted" style="font-size:11.5px">${over?'Over budget':'Budget '+inr(S.budget)}</div></button><button class="btn" style="width:160px" onclick="go('review')">Review & book</button></div>`);
}
function whyText(){
  const W={explore:{coorg:'You want to explore. Coorg has hills, coffee and local food, with one relaxed thing a day.'},team:{pondy:'You want to socialise. Pondicherry has lively cafés and beach evenings, with free time left open.'},unwind:{coorg:'You want to recharge. One great stay with a spa, and no hotel-hopping.'}};
  return (S.feel&&W[S.feel][S.plan])||PLANS[S.plan].why;
}
function setFeel(k){
  S.feel=k;S.dm={};const pl=bestPlace();S.plan=pl;
  if(k==='unwind'){S.alt.t2=3;S.locks.add('t2');}else{delete S.alt.t2;}
  drawFeel();drawSlots();toast(`${MOODS[k].name}: AI will suggest ${PLANS[pl].name}`);
}
function drawFeel(){
  $('#feel').innerHTML=Object.entries(MOODS).map(([k,m])=>`<button class="fcard ${S.feel===k?'on':''}" onclick="setFeel('${k}')"><span class="fi" style="background:${m.bg};color:${m.c}">${ic(m.icon,20)}</span><b>${m.name}</b><span>${m.ex}</span></button>`).join('');
}
function itemRow(i){
  if(!i)return'';const lk=S.locks.has(i.id);

   ${i.flex?`<div style="margin-top:4px"><span class="tag flex">${ic('moon',11)} ${i.picked?'Your pick':S.checked?'Matched on Wed':'Flexible till Wed'}</span></div>`:''}
   ${i.team?`<button class="link" style="margin-top:6px" onclick="invite()">${S.invited?'See invite':'Invite friends or colleagues →'}</button>`:''}

   </div><div class="pr">${i.free?'<span class="muted">Free</span>':inr(i.cost)}<div><span class="tag ${i.co?'co':'me'}">${i.co?'Company':'You'}</span></div></div></div>`;

function saveSheet(){
  const me=meTotal(),ok=me<=S.budget,c=S.plan==='coorg';

  const cur=S.alt.t2??null;
  const stayCost=i=>{const k=S.alt.t2;if(i===null)delete S.alt.t2;else S.alt.t2=i;const v=resolve(rawById('t2')).cost;if(k==null)delete S.alt.t2;else S.alt.t2=k;return v;};
  const base=stayCost(cur);
  openSheet(`<div class="row sp"><div class="h">Ways to save</div><span class="tag ${ok?'ok':'me'}" style="font-size:12px">${ok?'Within budget ✓':inr(me-S.budget)+' over'}</span></div>

  <button class="btn" style="margin-top:16px" onclick="closeSheet()">Done</button>`);
}
function hl(ids){ids.forEach(i=>S.hl.add(i));setTimeout(()=>{ids.forEach(i=>S.hl.delete(i));document.querySelectorAll('.it.hl').forEach(e=>e.classList.remove('hl'));},1800);}
function lock(id){S.locks.has(id)?S.locks.delete(id):S.locks.add(id);toast(S.locks.has(id)?'Locked. AI won’t change this.':'Unlocked');plan();}
function fix(f){
  if(f==='short'){S.end=5;toast('Trip now ends Saturday');}
  if(f==='stay'){S.alt.t2=4;S.locks.delete('t2');hl(['t2']);toast('Changed to a coffee estate homestay');}
  if(f==='blr'){S.plan='blr';toast('Switched to Bengaluru');}
  if(f==='raise'){S.budget=Math.ceil(meTotal()/1000)*1000;toast('Budget is now '+inr(S.budget));}
  plan();
}
function ask(q){
  if(S.plan!=='coorg'&&q!=='Cheaper stay'){toast('Try this on the Coorg plan');return;}
  if(q==='Cheaper stay'){if(S.plan!=='coorg'){toast('Already the cheapest stay here');return;}if(S.locks.has('t2')){toast('Misty Ridge is locked. Unlock it first.');return;}S.alt.t2=0;hl(['t2']);toast('Cheaper stay: Fernhill Estate');}
  if(q==='Add a spa'){if(!S.added.find(a=>a.id==='spa'))S.added.push({id:'spa',t:'5:00 PM',kind:'leaf',title:'Ayurvedic massage',meta:'75 min · at the estate',cost:2800});hl(['spa']);toast('Spa added: +₹2,800');}
  if(q==='Less driving'){S.alt.u1=0;hl(['u1']);toast('Cab + short flight: 2.5 hrs less driving');}
  plan();
}
function askFree(){
  const el=$('#askIn');const v=(el&&el.value||'').trim();if(!v)return;const l=v.toLowerCase();
  if(/cheap|budget|save/.test(l))return ask('Cheaper stay');
  if(/spa|massage/.test(l))return ask('Add a spa');
  if(/driv|far|tired of road/.test(l))return ask('Less driving');
  if(/beach|sea|coast/.test(l)){if(fits('pondy')){S.plan='pondy';plan();toast('Switched to Pondicherry: beach & cafés');}else toast('A beach needs at least till Saturday');return;}
  if(/city|no travel|stay in bengaluru/.test(l)){S.plan='blr';plan();toast('Switched to a Bengaluru city break');return;}
  if(/quiet|calm|relax/.test(l)){FLEX.forEach(f=>S.dm[f]='unwind');hl(FLEX);plan();toast('Made the flexible days calmer');return;}
  if(/trek|adventure|hike/.test(l)){S.dm.f1='explore';hl(['f1']);plan();toast('Friday is now a trek');return;}
  S.notes.push(/veg/.test(l)?'Vegetarian meals':v.length>28?v.slice(0,28)+'…':v);plan();toast('Noted. I’ll pass this to your hosts.');
}

function change(id){const r=rawById(id),cur=resolve(r);
  const opts=[null].concat(r.alts.map((_,i)=>i)).map(idx=>{const keep=S.alt[id];if(idx===null)delete S.alt[id];else S.alt[id]=idx;const o=resolve(r);if(keep==null)delete S.alt[id];else S.alt[id]=keep;return {...o,idx};});

  ${opts.map(o=>{const sel=(S.alt[id]??null)===o.idx;const d=o.cost-cur.cost;return `<button class="alt ${sel?'on':''}" onclick="pick('${id}',${o.idx})"><span class="radio" style="${sel?'border-color:var(--or)':''}">${sel?'<i style="width:10px;height:10px;border-radius:50%;background:var(--or);display:block"></i>':''}</span><span style="flex:1"><b>${o.title}</b>${o.idx===null?' <span class="tag ok">AI pick</span>':''}<span class="muted" style="display:block">${o.meta}</span></span><span style="text-align:right"><b>${inr(o.cost)}</b><span style="display:block" class="${d>0?'up':'dn'}">${sel?'Current':(d>0?'+':'−')+inr(Math.abs(d))}</span></span></button>`}).join('')}`);}
function pick(id,idx){if(idx===null)delete S.alt[id];else S.alt[id]=idx;S.locks.delete(id);closeSheet();hl([id]);plan();toast('Changed. Nothing else moved.');}
function ledger(){openSheet(`<div class="h">Who pays what</div><div class="box2"><div style="background:var(--blue-lt)"><div class="muted" style="color:var(--blue);font-weight:600">Company</div><div class="price">${inr(coTotal())}</div><div class="muted">${S.slip?'+1 work night':'Not changed'}</div></div><div style="background:var(--or-lt)"><div class="muted" style="color:var(--or-dk);font-weight:600">You</div><div class="price">${inr(meTotal())}</div><div class="muted">Holiday part</div></div></div><p class="muted" style="margin-top:12px">You get two separate invoices.</p><button class="btn" style="margin-top:14px" onclick="closeSheet()">Done</button>`);}

function book(){
  clearT();bar('');
  const its=items().filter(i=>!i.co&&!i.free&&i.title);S.bl=its;S.bs=its.map(()=>'');
  scr.innerHTML=hdr('Booking your holiday',inr(meTotal())+' · you pay once','review')+`<div class="pad fade" style="padding-bottom:120px">
  <div class="row" id="holdnote" style="padding:12px;border-radius:10px;background:var(--green-lt);color:#0b5e40;font-size:13px">${ic('shield',18)}<span>We hold everything first. You pay only if all items are confirmed.</span></div>
  <div id="hl" style="margin-top:6px"></div><div id="bm"></div></div>`;
  drawHolds();runHolds(0);
}
function drawHolds(){const lab={ing:'Holding…',ok:'Held',pa:'Paused',fl:'Sold out'};$('#hl').innerHTML=S.bl.map((i,n)=>{const s=S.bs[n];return `<div class="hold ${s}"><div class="s">${s==='ok'?ic('check',12,'color:#fff'):s==='fl'?ic('x',11,'color:#fff'):''}</div><div class="n">${i.title}<small>${s==='ok'&&i.flex?'Held · free to change till Wed':lab[s]||'Waiting'}</small></div><b>${inr(i.cost)}</b></div>`}).join('');}
function runHolds(from){
  for(let n=from;n<S.bl.length;n++)timers.push(setTimeout(()=>{
    if(S.screen!=='book')return;if(n>0&&S.bs[n-1]==='ing')S.bs[n-1]='ok';
    const it=S.bl[n];
    if(S.sim.soldout&&it.id==='t2'&&S.alt.t2==null&&!S.soldDone){S.bs[n]='fl';drawHolds();clearT();
      $('#bm').innerHTML=`<div class="err fade"><b>Misty Ridge just sold out</b><div style="margin-top:4px">Nothing was charged. Closest match: <b>Fernhill Estate</b>, same area, cheaper.</div><div class="row" style="gap:8px;margin-top:10px"><button class="chip" onclick="S.soldDone=true;S.alt.t2=0;book()">Use Fernhill</button><button class="chip" onclick="S.soldDone=true;go('plan');change('t2')">See others</button></div></div>`;return;}
    S.bs[n]='ing';drawHolds();
    if(S.sim.overrun&&S.plan==='coorg'&&!S.slip&&n===2){clearT();timers.push(setTimeout(()=>{S.bs[n]='pa';drawHolds();
      toast(`${ic('cal',18)} <span><b>Calendar update</b><br>Your Thursday meeting moved to 11 AM.</span>`,'w',3800);
      $('#bm').innerHTML=`<div class="warn fade"><b>Booking paused</b><div style="margin-top:4px">Your Thursday changed. Nothing is charged yet.</div><button class="btn sm" style="margin-top:10px;background:var(--ink)" onclick="go('slip')">See what changes</button></div>`;},800));return;}
  },400+(n-from)*600));
  timers.push(setTimeout(()=>{if(S.screen!=='book')return;S.bs=S.bs.map(()=>'ok');drawHolds();
    bar(`<div class="row sp"><div><div class="muted">All held · you pay</div><div class="price">${inr(meTotal())}</div></div><button class="btn" style="width:170px" onclick="S.edge=null;go('done')">Pay now</button></div>`);},400+(S.bl.length-from)*600+150));
}

  bar(`<div class="row" style="gap:8px"><button class="btn out" style="width:120px" onclick="drawEnergy()">Back</button><button class="btn" onclick="S.en='${k}';S.checked=true;go('plan');hl([${ch.map(c=>`'${c[1].id}'`).join(',')}]);plan();toast('Trip updated · no fees')">Update my trip</button></div>`);

function drawSwipe(){

    const picks=Object.entries(S.sw.keep);
    h+=`<div class="h" style="margin-top:16px">${picks.length?'Here’s what changes':'Nothing picked'}</div><div class="muted">${picks.length?'Free to change. Hotels and flight stay the same.':'Your plan stays as it is.'}</div>
     ${picks.map(([slot,m])=>{const it=MOODS[m][slot];return `<div class="res"><span style="width:40px;height:40px;border-radius:10px;display:grid;place-items:center;background:${MOODS[m].bg};color:${MOODS[m].c}">${ic(MOODS[m].icon,20)}</span><div style="flex:1"><div class="muted" style="font-size:11.5px">${{w3:'Tonight',f1:'Friday',s1:'Saturday'}[slot]}</div><b>${it.title}</b></div><b>${it.cost?inr(it.cost):'Free'}</b></div>`}).join('')}`;
    scr.innerHTML=h+`</div>`;
    bar(`<div class="row" style="gap:8px"><button class="btn out" style="width:120px" onclick="S.sw={i:0,keep:{}};drawSwipe()">Redo</button><button class="btn" onclick="applySwipe()">${picks.length?'Update my trip':'Continue'}</button></div>`);
  }
}
function card(c,cls){const it=MOODS[c.m][c.slot];return `<div class="vc ${cls}" ${cls==='top'?'id="vtop"':''} style="background:${GRAD[c.m]}"><div class="row sp"><span class="when">${c.when}</span></div><div class="stamp y">YES</div><div class="stamp n">SKIP</div><div class="big">${ic(MOODS[c.m].icon,40,'color:#fff')}</div><div><div class="vt">${it.title}</div><div class="vp">${it.meta} · ${it.cost?inr(it.cost):'Free'}</div></div></div>`;}
function bindCard(){
  const el=$('#vtop');if(!el)return;let x0=null,dx=0;
  el.addEventListener('pointerdown',e=>{x0=e.clientX;el.setPointerCapture(e.pointerId);el.style.transition='none';});
  el.addEventListener('pointermove',e=>{if(x0===null)return;dx=e.clientX-x0;el.style.transform=`translateX(${dx}px) rotate(${dx/18}deg)`;el.querySelector('.y').style.opacity=Math.max(0,dx/90);el.querySelector('.n').style.opacity=Math.max(0,-dx/90);});
  el.addEventListener('pointerup',()=>{x0=null;el.style.transition='';if(Math.abs(dx)>90)decide(dx>0);else{el.style.transform='';el.querySelectorAll('.stamp').forEach(s=>s.style.opacity=0);}dx=0;});
}
function decide(yes){
  const el=$('#vtop'),c=VCARDS[S.sw.i];if(!c)return;
  if(yes)S.sw.keep[c.slot]=c.m;
  if(el){el.style.transform=`translateX(${yes?420:-420}px) rotate(${yes?20:-20}deg)`;el.style.opacity=0;el.querySelector(yes?'.y':'.n').style.opacity=1;}
  setTimeout(()=>{S.sw.i++;drawSwipe();},260);
}
function applySwipe(){const picks=S.sw.keep;Object.assign(S.dm,picks);S.checked=true;go('plan');hl(Object.keys(picks));plan();if(Object.keys(picks).length)toast(Object.keys(picks).length+' items updated · no extra fees');if(picks.w3==='team'&&!S.invited)setTimeout(invite,900);}

/* ================= annotations ================= */
const ANN={
 trips:[['#nudge','AI spots your free days','Reads your work trip and calendar. You type nothing.','L'],['.week','Work vs free, at a glance','Blue = work. Orange = free days.','R'],['.tag.co','Company trip stays separate','Paid by your company, never mixed.','R'],['.empty .btn','Empty state','No trips yet? Forward a booking to start.','L']],
 context:[['#feel','How do you want to feel?','From research: 3 people wanted 3 kinds of break. This one choice shapes everything.','L'],['#wk','Stretch the trip','Drag the circle to pick your last day. No form, no chat.','R'],['#bud','Budget in one tap','Only your part. Company pays for work.','L'],['#who','Bring a partner','Adds their flight on Wednesday.','R'],['[data-slot=w3]','AI fills every day','Matches your feeling. Can change on Wed.','L'],['.slot.fixed','Travel is handled','Place is picked on the next screen.','R'],['.tray','Fine-tune any day','Drag Explore, Socialise or Recharge onto a day.','R']],
 planning:[['#sts','AI shows its work','Real steps, not a spinner.','L'],['.err','Flights down? Go by road','The AI offers road trips instead of a dead end.','R'],['#road','Nearby by road','Coorg, Mysuru or a city break, priced.','L'],['.btn.out','Always cancellable','Stop any time.','R']],
 plan:[['.opts','3 places, best match first','Places that don’t fit your dates are greyed out.','L'],['.why1','Why AI picked it','One line of reasoning.','R'],['.info','Two-speed plan','3 items stay flexible until Wednesday.','R'],['.warn','Over budget? Ways to save','Homestays, local homes, buses, a shorter trip.','L'],['.pend','Flight not confirmed yet','Plan by road now; flight confirmed before you pay.','L'],['.work','Work part untouched','Company cost stays the same.','L'],['.it .tag.me','Who pays: You or Company','Every item is tagged.','R'],['.it .ac','Why · Change · Lock','Change one item without starting over.','L'],['.ask','Ask AI anything','“Near a beach”, “vegetarian”, “less driving”.','R']],
 review:[['.box2','Two wallets','Company cost unchanged. Your part separate.','L'],['.rv','Policy check','AI confirms no approval is needed.','R'],['.sec .sw','Holiday kept private','Travel desk sees only “Personal leave”.','R'],['.link','Note for your manager','Drafted for you.','L'],['.bar .btn','Hold first, pay once','Nothing is charged until all items are held.','R']],
 book:[['#holdnote','Hold first, pay once','If any item fails, nothing is charged.','L'],['.hold.pa','Plans change mid-booking','A moved meeting pauses booking.','R'],['#bm .warn','Paused safely','Nothing charged. See what changes.','R'],['.hold.fl','Sold out while holding','AI offers the closest match.','R'],['#bm .err','Nothing charged','One tap to accept the substitute.','L']],
 slip:[['.chg','Only what changed','Before → after. Nothing else moves.','L'],['.box2','Who pays updates itself','The work night moves to the company.','R'],['.bar .btn.out','You stay in control','Keep the old plan if you want.','R']],
 done:[['.box2','Two clean invoices','Company and personal, never mixed.','L'],['#preview','What happens next','On Wednesday, AI checks how you feel.','R']],
 checkin:[['.notif','Wednesday 5 PM nudge','Arrives as work ends.','L'],['#en','Plans around your energy','Drained, okay, buzzing, or still in a meeting. The trip adapts, it doesn’t restart.','R'],['.chg','Only what changes','Before → after, with the price and no fees.','L'],['.box2','Cost of adapting','Free till 6 PM.','R'],['#vtop','Swipe to fine-tune','Right = yes, left = skip.','R'],['.dots','6 quick cards','Calm cards first after a busy week.','L']],
};
function buildAnn(){
  ['colL','colR'].forEach(c=>$('#'+c).innerHTML='');
  (ANN[S.screen]||[]).forEach(a=>{const d=document.createElement('div');d.className='ann';d.dataset.sel=a[0];d.innerHTML=`<b><i></i>${a[1]}</b>${a[2]}`;$(a[3]==='L'?'#colL':'#colR').appendChild(d);});
  placeAnn();
}
function placeAnn(){
  const st=$('#stage');if(!st||getComputedStyle($('#colL')).display==='none')return;
  const sr=st.getBoundingClientRect(),ph=document.querySelector('.phone').getBoundingClientRect();
  let lines='';const shownAll=[];
  ['L','R'].forEach(side=>{
    const col=$(side==='L'?'#colL':'#colR'),cr=col.getBoundingClientRect();
    const its=[...col.querySelectorAll('.ann')].map(el=>{
      let t=null;for(const sel of el.dataset.sel.split(',')){const c=[...document.querySelectorAll('.phone '+sel.trim())].find(x=>x.offsetParent!==null);if(c){t=c;break;}}
      const r=t&&t.getBoundingClientRect();const bEl=document.querySelector('.phone .bar, .phone .nav');const lim=bEl&&!(t&&bEl.contains(t))?bEl.getBoundingClientRect().top:ph.bottom-10;const vis=r&&r.bottom>ph.top+50&&r.top+12<lim&&r.height>0;
      return {el,r,vis,y:vis?(r.top+Math.min(r.height,60)/2-cr.top):0};
    });
    const shown=its.filter(i=>i.vis).sort((a,b)=>a.y-b.y);its.filter(i=>!i.vis).forEach(i=>i.el.style.display='none');
    let yy=0;
    shown.forEach(i=>{i.el.style.display='';const h=i.el.offsetHeight;let top=Math.max(i.y-h/2,yy);top=Math.min(top,cr.height-h);i.el.style.top=top+'px';yy=top+h+10;shownAll.push({el:i.el,y:top});
      const bx=side==='L'?cr.right-sr.left:cr.left-sr.left,by=top+h/2+cr.top-sr.top;
      const tx=side==='L'?Math.max(i.r.left,ph.left+8)-sr.left+6:Math.min(i.r.right,ph.right-8)-sr.left-6,ty=Math.max(i.r.top+Math.min(i.r.height,60)/2,ph.top+50)-sr.top;
      lines+=`<path d="M${bx} ${by} C ${(bx+tx)/2} ${by}, ${(bx+tx)/2} ${ty}, ${tx} ${ty}" fill="none" stroke="#FF8A5E" stroke-width="1.5" stroke-dasharray="2 4" stroke-linecap="round"/><circle cx="${tx}" cy="${ty}" r="4" fill="#FF4F17" stroke="#fff" stroke-width="1.5"/>`;});
  });
  $('#lines').innerHTML=lines;
  shownAll.sort((a,b)=>a.y-b.y).forEach((o,i)=>{const n=o.el.querySelector('i');if(n.textContent!=String(i+1))n.textContent=i+1;});
}
setInterval(placeAnn,250);window.addEventListener('resize',placeAnn);

let tt;function toast(h,c='',ms=2400){const t=$('#toast');t.className='toast '+c;t.innerHTML=h;requestAnimationFrame(()=>t.classList.add('on'));clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),ms);}
